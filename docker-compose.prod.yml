# Production compose — billing.indiansoftwareservices.com
#   cp .env.example .env && fill secrets
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billing-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_CLIENT_EMAIL: ${GCS_CLIENT_EMAIL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-gcs}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcs-key.json
      UPLOAD_DIR: /app/uploads
      EINVOICE_PROVIDER: ${EINVOICE_PROVIDER:-null}
      EWAY_PROVIDER: ${EWAY_PROVIDER:-stub}
      EWAY_API_URL: ${EWAY_API_URL:-}
      EWAY_API_KEY: ${EWAY_API_KEY:-}
    volumes:
      - billing_uploads:/app/uploads
      - ${GCS_KEY_FILE:-./billing-503106-646b7d87cc1e.json}:/app/secrets/gcs-key.json:ro
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: billing-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

volumes:
  billing_pgdata:
  billing_uploads:

networks:
  internal:
    name: billing_prod
    driver: bridge
