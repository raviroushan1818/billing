server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow IndHMS clinical workspace to embed billing (SSO iframe).
  # Do not set X-Frame-Options — it cannot allowlist another origin; CSP frame-ancestors does.
  add_header Content-Security-Policy "frame-ancestors 'self' https://indhms.indiansoftwareservices.com http://localhost:3000 http://127.0.0.1:3000;" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection "0" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  location /api/ {
    proxy_pass http://billing-backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /api/health {
    proxy_pass http://billing-backend:3000/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    # Nested locations do not inherit parent add_header — re-apply frame policy
    add_header Content-Security-Policy "frame-ancestors 'self' https://indhms.indiansoftwareservices.com http://localhost:3000 http://127.0.0.1:3000;" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
