# Billing SaaS — edge routing (included by shared vetbook_nginx)
# Domain: https://billing.indiansoftwareservices.com

upstream billing_frontend {
  server billing-frontend:80;
}

upstream billing_api {
  server billing-backend:3000;
}

server {
  listen 80;
  server_name billing.indiansoftwareservices.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name billing.indiansoftwareservices.com;

  ssl_certificate /etc/letsencrypt/live/billing.indiansoftwareservices.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/billing.indiansoftwareservices.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:BillingSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 25m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://billing_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://billing_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
